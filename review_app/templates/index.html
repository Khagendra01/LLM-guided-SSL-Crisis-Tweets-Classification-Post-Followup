<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit V2 — Human Review</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">A2</div>
    <div>
      <div class="brand-title">Audit V2 Review</div>
      <div class="brand-sub" id="progText">0/500</div>
    </div>
  </div>
  <div class="progress-col">
    <div class="progress-bar"><div id="progFill"></div></div>
    <div class="progress-meta"><span id="counts"></span><span id="counts2"></span></div>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="guideToggle">Guide</button>
    <button class="btn ghost" id="validateBtn">Validate</button>
    <button class="btn primary" id="exportBtn">Export</button>
  </div>
</header>

<div class="toolbar">
  <div class="filters">
    <select id="fPriority" class="pill"><option value="">All priorities</option><option value="P1_unanimous_models_disagree_with_HumAID">P1 Unanimous</option><option value="P2_3of4_models_disagree_with_HumAID">P2 3/4</option><option value="P3_model_split">P3 Split</option><option value="P4_strong_model_consensus_matches_HumAID">P4 Match</option></select>
    <select id="fEvent" class="pill"><option value="">All events</option></select>
    <select id="fStatus" class="pill"><option value="">All status</option><option value="pending">Pending</option><option value="reviewed">Reviewed</option><option value="bookmarked">★ Bookmarks</option></select>
    <select id="fConsensus" class="pill"><option value="">All consensus</option><option value="4_of_4">4/4</option><option value="3_of_4">3/4</option><option value="2_1_1">2-1-1</option><option value="2_2_tie">2-2 tie</option><option value="all_different">All diff</option></select>
    <div class="search">
      <input id="jumpId" placeholder="AUDITV2_0001" spellcheck="false">
      <button id="jumpBtn" class="btn small">Go</button>
    </div>
  </div>
  <div class="nav-row">
    <button id="prevBtn" class="btn ghost">← Prev</button>
    <div id="posLabel" class="pos"></div>
    <button id="nextBtn" class="btn ghost">Next →</button>
    <button id="bookmarkBtn" class="btn ghost">☆ Bookmark</button>
    <button id="skipBtn" class="btn ghost">Skip</button>
  </div>
</div>

<div class="app">
  <aside class="queue-pane">
    <div class="pane-head">Queue <span id="queueCount"></span></div>
    <div id="queueList" class="queue"></div>
  </aside>

  <main class="card-pane">
    <div id="card"></div>
  </main>

  <aside class="guide-pane" id="guidePane">
    <div class="pane-head">Label Guide <button class="btn small ghost" id="guideClose">✕</button></div>
    <div id="labelGuide" class="guide"></div>
    <div class="guide-section">
      <h4>Tie-breaking</h4>
      <ol id="tieList"></ol>
    </div>
    <div class="kbd-help">
      <h4>Shortcuts</h4>
      <div><kbd>←</kbd><kbd>→</kbd> prev/next &nbsp; <kbd>b</kbd> bookmark &nbsp; <kbd>s</kbd> skip &nbsp; <kbd>Ctrl+S</kbd> save &nbsp; <kbd>Ctrl+Enter</kbd> finalize</div>
    </div>
  </aside>
</div>

<div id="msg" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
