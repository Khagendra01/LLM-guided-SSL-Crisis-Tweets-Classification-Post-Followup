name: Finalize Audit V2 researcher first pass

on:
  push:
    branches:
      - audit-v2-clean
    paths:
      - "research_repo_payload/research_audit/audit_v2_500/FINALIZE_FIRST_PASS_REQUEST"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-v2-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and finalize exact first pass
        run: |
          python research_repo_payload/research_audit/scripts/finalize_researcher_first_pass.py

      - name: Remove broken and temporary payloads
        run: |
          git rm -r research_repo_payload/research_audit/audit_v2_500/.chatgpt_frozen_payload
          git rm -r research_repo_payload/research_audit/audit_v2_500/.first_pass_recovery
          git rm research_repo_payload/research_audit/audit_v2_500/FINALIZE_FIRST_PASS_REQUEST

      - name: Commit validated normal CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_repo_payload/research_audit/audit_v2_500/researcher_ai_assisted_first_pass_FROZEN.csv
          git add research_repo_payload/research_audit/audit_v2_500/RESEARCHER_FIRST_PASS_SHA256.txt
          git add research_repo_payload/research_audit/audit_v2_500/researcher_first_pass_validation.json
          git add -u research_repo_payload/research_audit/audit_v2_500
          git commit -m "Finalize complete 500-row researcher first pass [skip ci]"
          git fetch origin audit-v2-clean
          git rebase origin/audit-v2-clean
          git push origin HEAD:audit-v2-clean
